[package]
name = "sendme-browser"
version = "0.1.0"
edition = "2021"

# Exclude this crate from the parent workspace to avoid WASM-incompatible dependencies
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
bytes = "1.10"
console_error_panic_hook = "0.1"
futures-lite = "2.6"
iroh = { workspace = true, default-features = false, features = ["tls-ring"] }
iroh-blobs = { workspace = true, default-features = false }
js-sys = "0.3"
tokio = { workspace = true, default-features = false, features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-subscriber-wasm = "0.1"
wasm-bindgen = "=0.2"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = ["Window"]
