[package]
name = "app"
version = "0.1.3"
edition = "2021"

[lib]
name = "sendme_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
ios-web-inspector = []

[dependencies]
sendme-lib = { path = "../../lib" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.34.0", features = ["full"] }
tauri = { version = "2", features = ["tracing", "tray-icon", "image-png"] }
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.4.0"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-http = { version = "=2.4.3", features = ["unsafe-headers"] }
tauri-plugin-fs = "2"
tauri-plugin-sharesheet = { git = "https://github.com/rittme/tauri-plugin-sharesheet" }
tauri-plugin-opener = "2"
tauri-plugin-clerk = { path = "./plugins/tauri-plugin-clerk" }
anyhow = "1"
iroh.workspace = true
iroh-blobs.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "24"
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"
urlencoding = "2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-fs-ios = "0.4"
objc2 = "0.6"
tauri-plugin-media-picker = { path = "./plugins/tauri-plugin-media-picker" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
