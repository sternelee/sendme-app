    <script>
      (() => {
        try {
          const locale = localStorage.getItem("sendme.locale") || "en";
          const storedTheme = localStorage.getItem("theme") || "system";
          const resolvedTheme =
            storedTheme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : storedTheme;

          document.documentElement.lang = locale === "zh-CN" ? "zh-CN" : "en";
          document.documentElement.dataset.theme = resolvedTheme;
          window.__SENDME_BOOT_LOCALE__ = locale;
        } catch (_) {
          document.documentElement.lang = "en";
          document.documentElement.dataset.theme = "dark";
          window.__SENDME_BOOT_LOCALE__ = "en";
        }
      })();
    </script>

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background:
          radial-gradient(
            circle at top left,
            var(--boot-glow-primary),
            transparent 34%
          ),
          radial-gradient(
            circle at top right,
            var(--boot-glow-secondary),
            transparent 28%
          ),
          linear-gradient(
            180deg,
            var(--boot-bg-primary) 0%,
            var(--boot-bg-secondary) 100%
          );
        color: var(--boot-text);
      }

      body {
        min-height: 100vh;
      }

      #app {
        min-height: 100vh;
      }

      .boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 220;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
      }

      .boot-fallback.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-fallback__card {
        width: min(100%, 720px);
        border-radius: 28px;
        border: 1px solid var(--boot-card-border);
        background: var(--boot-card-bg);
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(18px);
        padding: 28px;
      }

      .boot-fallback__brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 18px;
      }

      .boot-fallback__logo {
        width: 56px;
        height: 56px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: rgba(124, 58, 237, 0.12);
        color: var(--boot-accent);
        box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.14);
        font-size: 22px;
      }

      .boot-fallback__eyebrow {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--boot-soft-text);
      }

      .boot-fallback__title {
        margin: 0;
        font-size: 32px;
        line-height: 1.04;
        letter-spacing: -0.04em;
      }

      .boot-fallback__subtitle {
        margin: 0 0 22px;
        max-width: 36rem;
        font-size: 14px;
        line-height: 1.7;
        color: var(--boot-soft-text);
      }

      .boot-fallback__status {
        border-radius: 20px;
        border: 1px solid var(--boot-card-border);
        background: var(--boot-status-bg);
        padding: 16px;
      }

      .boot-fallback__status-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        font-size: 14px;
        font-weight: 600;
      }

      .boot-fallback__pulse {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--boot-accent);
        box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.32);
        animation: boot-pulse 1.8s ease-out infinite;
      }

      .boot-fallback__track {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.22);
      }

      .boot-fallback__bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          var(--boot-accent),
          var(--boot-accent-2),
          var(--boot-accent)
        );
        animation: boot-progress 1.5s ease-in-out infinite;
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-140%);
        }
        100% {
          transform: translateX(340%);
        }
      }

      @keyframes boot-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.32);
        }
        70% {
          box-shadow: 0 0 0 16px rgba(124, 58, 237, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(124, 58, 237, 0);
        }

  <body>
    <div id="boot-fallback" class="boot-fallback">
      <div class="boot-fallback__card">
        <div class="boot-fallback__brand">
          <div class="boot-fallback__logo">◎</div>
          <div>
            <p class="boot-fallback__eyebrow" data-boot-i18n="eyebrow">
              Private transfer workspace
            </p>
            <h1 class="boot-fallback__title" data-boot-i18n="title">
              Preparing Sendme
            </h1>
          </div>
        </div>
        <p class="boot-fallback__subtitle" data-boot-i18n="subtitle">
          Launching a secure peer-to-peer session and restoring the tools you
          need to share right away.
        </p>
        <div class="boot-fallback__status">
          <div class="boot-fallback__status-row">
            <span class="boot-fallback__pulse"></span>
            <span data-boot-i18n="status">Connecting secure services</span>
          </div>
          <div class="boot-fallback__track">
            <div class="boot-fallback__bar"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      (() => {
        const locale =
          window.__SENDME_BOOT_LOCALE__ === "zh-CN" ? "zh-CN" : "en";
        const copy = {
          en: {
            eyebrow: "Private transfer workspace",
            title: "Preparing Sendme",
            subtitle:
              "Launching a secure peer-to-peer session and restoring the tools you need to share right away.",
            status: "Connecting secure services",
          },
          "zh-CN": {
            eyebrow: "私密传输工作区",
            title: "正在准备 Sendme",
            subtitle:
              "正在启动安全的点对点会话，并恢复你进入传输所需的关键工具。",
            status: "正在连接安全服务",
          },
        }[locale];

        document.querySelectorAll("[data-boot-i18n]").forEach((element) => {
          const key = element.getAttribute("data-boot-i18n");
          if (!key || !copy[key]) return;
          element.textContent = copy[key];
        });
      })();
    </script>
  </body>
