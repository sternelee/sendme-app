name: app
options:
  bundleIdPrefix: io.sendme.app
  deploymentTarget:
    iOS: "15.1"
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Sendme
      PRODUCT_BUNDLE_IDENTIFIER: io.sendme.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  app_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: app_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: app_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.31.0
        CFBundleVersion: "0.31.0"
    entitlements:
      path: app_iOS/app_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        SWIFT_VERSION: 6.0
        IPHONEOS_DEPLOYMENT_TARGET: 15.1
        DEVELOPMENT_TEAM: UJ8NW4N779
        CODE_SIGN_STYLE: Automatic
        SWIFT_COMPILATION_MODE: wholemodule
        SWIFTC_PARAMETERS: -use-static-resource-dir
        OTHER_LDFLAGS: $(inherited) -Wl,-undefined,dynamic_lookup
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        SWIFT_EMBED_BITCODE: false
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - name: Build Rust Code
        script: |
          set -euo pipefail
          APP_ROOT="${SRCROOT}/../../.."
          WORKSPACE_ROOT="${APP_ROOT}/.."
          IOS_ASSETS_DIR="${SRCROOT}/assets"

          cd "${APP_ROOT}"
          pnpm run build

          rm -rf "${IOS_ASSETS_DIR}"
          mkdir -p "${IOS_ASSETS_DIR}"
          rsync -a --delete "${APP_ROOT}/dist/" "${IOS_ASSETS_DIR}/"

          case "${PLATFORM_NAME:?}" in
            iphoneos)
              TARGET_TRIPLE="aarch64-apple-ios"
              TARGET_ARCH_DIR="arm64"
              ;;
            iphonesimulator)
              case "${ARCHS:?}" in
                x86_64)
                  TARGET_TRIPLE="x86_64-apple-ios"
                  TARGET_ARCH_DIR="x86_64"
                  ;;
                *)
                  TARGET_TRIPLE="aarch64-apple-ios-sim"
                  TARGET_ARCH_DIR="arm64"
                  ;;
              esac
              ;;
            *)
              echo "Unsupported PLATFORM_NAME: ${PLATFORM_NAME:?}" >&2
              exit 1
              ;;
          esac

          case "${CONFIGURATION:?}" in
            release|Release)
              PROFILE_FLAG="--release"
              PROFILE_DIR="release"
              FEATURE_FLAGS="--features custom-protocol"
              ;;
            *)
              PROFILE_FLAG=""
              PROFILE_DIR="debug"
              FEATURE_FLAGS=""
              ;;
          esac

          cd "${WORKSPACE_ROOT}"
          cargo build -p app --manifest-path "${APP_ROOT}/src-tauri/Cargo.toml" --target "${TARGET_TRIPLE}" ${PROFILE_FLAG} ${FEATURE_FLAGS}

          mkdir -p "${SRCROOT}/Externals/${TARGET_ARCH_DIR}/${CONFIGURATION}"
          cp "${WORKSPACE_ROOT}/target/${TARGET_TRIPLE}/${PROFILE_DIR}/libsendme_app.a" \
            "${SRCROOT}/Externals/${TARGET_ARCH_DIR}/${CONFIGURATION}/libapp.a"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
