[workspace]
members = ["lib", "cli", "app/src-tauri", "peersync"]
resolver = "2"

# Note: browser-lib crate is a separate workspace to avoid WASM-incompatible
# dependencies. Build it separately with:
#   cd browser-lib && cargo build --target=wasm32-unknown-unknown
# Or from the browser demo:
#   cd browser && pnpm run build

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["Rüdiger Klaehn <rklaehn@protonmail.com>", "n0 team"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/n0-computer/sendme"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.75"
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
iroh-docs = "0.101.0"
iroh-gossip = { version = "0.101.0", features = ["net"], default-features = false }
tokio = { version = "1.34.0", features = ["full"] }

[profile.release]
panic = "abort"
opt-level = "s"
codegen-units = 1
lto = true
debug = "none"
strip = true


